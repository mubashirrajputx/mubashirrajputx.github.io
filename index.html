<!DOCTYPE html>
<html>
<head>
  <style>
    /* Default Light Theme */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
      transition: background-color 0.4s, color 0.4s;
    }

    /* Dark Theme Class */
    .dark-theme {
      background-color: #121212 !important;
      color: #f1f1f1 !important;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .dark-theme header {
      border-bottom-color: #333;
    }

    .theme-btn {
      padding: 8px 16px;
      font-size: 14px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Projects Grid */
    .projects-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
    }

    .project-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      width: 220px;
      background-color: #ffffff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .dark-theme .project-card {
      background-color: #1e1e1e;
      border-color: #444;
      color: #fff;
    }

    .project-card h4 { margin-top: 0; color: #007bff; }
    .dark-theme .project-card h4 { color: #4da3ff; }

    /* Contact Section */
    .contact-box {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      background-color: #e9ecef;
    }

    .dark-theme .contact-box {
      background-color: #242424;
    }

    input, textarea {
      width: 90%;
      padding: 8px;
      margin-top: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <!-- 1. Header with Dark Mode Toggle -->
  <header>
    <div>
      <h2 style="margin: 0;">Rana Mubashir 💻</h2>
      <p style="margin: 5px 0 0 0; color: #666;">Web Developer & Graphic Designer</p>
    </div>
    <button class="theme-btn" onclick="togglePortfolioTheme()">Mode Change 🌓</button>
  </header>

  <!-- 2. Dynamic Projects Section -->
  <section>
    <h3>My Featured Projects 🚀</h3>
    <button onclick="renderProjects()" style="padding: 6px 12px; cursor: pointer;">Load Projects via JS</button>
    <div id="projectGrid" class="projects-container"></div>
  </section>

  <!-- 3. Interactive Contact Form -->
  <section class="contact-box">
    <h3>Get In Touch 📩</h3>
    <input type="text" id="visitorName" oninput="updateLiveMessage()" placeholder="Apna Naam Likhien...">
    <p><b>Live Preview:</b> Welcome <span id="previewName" style="color: #007bff; font-weight: bold;">Visitor</span>!</p>
  </section>

  <script>
    // Theme Switcher Logic (Day 27 Concept)
    function togglePortfolioTheme() {
      document.body.classList.toggle("dark-theme");
    }

    // Array of Objects Data (Day 24 & 25 Concept)
    let myProjects = [
      { title: "Dynamic Web App", category: "JavaScript / HTML", status: "Completed" },
      { title: "Al-Khair Pharmacy Poster", category: "Graphic Design", status: "Delivered" },
      { title: "Sports Graphics Layout", category: "Branding", status: "Active" }
    ];

    // Render Projects on Screen (Day 22 & 25 Loop)
    function renderProjects() {
      let grid = document.getElementById("projectGrid");
      grid.innerHTML = ""; // Clear existing

      for (let i = 0; i < myProjects.length; i++) {
        grid.innerHTML += 
          "<div class='project-card'>" +
            "<h4>" + myProjects[i].title + "</h4>" +
            "<p><b>Category:</b> " + myProjects[i].category + "</p>" +
            "<p style='color: green;'><b>Status:</b> " + myProjects[i].status + "</p>" +
          "</div>";
      }
    }

    // Live Input Event (Day 26 Concept)
    function updateLiveMessage() {
      let val = document.getElementById("visitorName").value;
      if (val.trim() === "") {
        document.getElementById("previewName").innerText = "Visitor";
      } else {
        document.getElementById("previewName").innerText = val;
      }
    }
  </script>

</body>
</html>
